<article class="card">
  <a class="card-media" href="/products/{{ p.slug }}" tabindex="-1" aria-hidden="true">
    <img src="{{ p.image }}" alt="" width="1000" height="1000" loading="lazy">
    {% if not p.in_stock %}<span class="badge badge-out">Sold out</span>
    {% elif p.badge %}<span class="badge">{{ p.badge }}</span>{% endif %}
  </a>
  <div class="card-body">
    <h3><a href="/products/{{ p.slug }}">{{ p.name }}</a></h3>
    <p class="meta">{{ p.color }}</p>
    <p class="price">{{ p.price|money }}</p>
  </div>
  <div class="card-actions">
    <a class="link-quiet" href="/products/{{ p.slug }}">View details</a>
    {% if p.in_stock %}
      <button class="link-quiet" type="button" data-quick-add aria-expanded="false" aria-controls="qa-{{ p.id }}">Quick add</button>
    {% else %}
      <span class="muted small">Unavailable</span>
    {% endif %}
  </div>
  {% if p.in_stock %}
  <div class="quick-add" id="qa-{{ p.id }}" hidden>
    <p class="small">Select a size to add {{ p.name }}</p>
    <div class="size-row">
      {% for s in p.sizes %}
        <button type="button" class="size-chip" data-add data-product-id="{{ p.id }}" data-size="{{ s.size }}" {% if s.stock == 0 %}disabled title="Sold out"{% endif %}>{{ s.size }}</button>
      {% endfor %}
    </div>
  </div>
  {% endif %}
</article>
