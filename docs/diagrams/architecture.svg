<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">SOLE ATELIER on AWS: target design, not deployed</title>
  <desc id="d">Internet users reach an internet-facing Application Load Balancer in public subnets, which forwards on port 8080 to FastAPI instances in private app subnets, which connect on port 3306 to an RDS MySQL instance in private database subnets. A NAT gateway provides outbound HTTPS. Secrets Manager and Systems Manager are reached over HTTPS.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #1f2933; }
      .h { font-size: 15px; font-weight: 600; } .s { font-size: 13px; fill: #4b5563; } .b { font-size: 14px; font-weight: 600; }
      .box { fill: #fff; stroke: #1f2933; stroke-width: 1.6; }
      .pub { fill: #eef5ff; stroke: #4a7fd4; stroke-width: 1.6; } .app { fill: #f1f8ee; stroke: #5a9a3c; stroke-width: 1.6; } .db { fill: #fff4e8; stroke: #d98324; stroke-width: 1.6; }
      .vpc { fill: none; stroke: #248814; stroke-width: 2; }
      .ln { stroke: #1f2933; stroke-width: 2; fill: none; } .dl { stroke: #6b7280; stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>

  <text x="40" y="50" font-size="28" font-weight="700" style="font-size:28px;font-weight:700">SOLE ATELIER on AWS</text>
  <text x="40" y="80" class="b" style="fill:#b45309;font-size:16px">TARGET DESIGN. Nothing in this diagram is deployed or verified yet.</text>

  <!-- Outside -->
  <rect class="box" x="40" y="400" width="150" height="70" rx="8"/>
  <text x="115" y="431" text-anchor="middle" class="b">Customer</text><text x="115" y="451" text-anchor="middle" class="b">browser</text>
  <path class="ln" d="M190,435 L262,435" marker-end="url(#a)"/>
  <text x="224" y="420" text-anchor="middle" class="s">HTTP 80</text>

  <!-- VPC -->
  <rect class="vpc" x="240" y="110" width="1100" height="700" rx="14"/>
  <text x="256" y="134" class="h" style="fill:#248814">VPC 10.0.0.0/16 (Region to be chosen, 2 Availability Zones)</text>
  <rect class="box" x="262" y="400" width="110" height="70" rx="8"/>
  <text x="317" y="431" text-anchor="middle" class="b">Internet</text><text x="317" y="451" text-anchor="middle" class="b">gateway</text>

  <!-- tier headings -->
  <text x="520" y="156" text-anchor="middle" class="h">Public subnets (alb-sg)</text>
  <text x="820" y="156" text-anchor="middle" class="h">Private app subnets (app-sg)</text>
  <text x="1150" y="156" text-anchor="middle" class="h">Private db subnets (db-sg)</text>

  <!-- subnets -->
  <rect class="pub" x="400" y="165" width="240" height="290" rx="8"/><text x="412" y="186" class="s">public-a  10.0.0.0/24  AZ a</text>
  <rect class="pub" x="400" y="495" width="240" height="290" rx="8"/><text x="412" y="516" class="s">public-b  10.0.1.0/24  AZ b</text>
  <rect class="app" x="700" y="165" width="240" height="290" rx="8"/><text x="712" y="186" class="s">app-a  10.0.10.0/24  AZ a</text>
  <rect class="app" x="700" y="495" width="240" height="290" rx="8"/><text x="712" y="516" class="s">app-b  10.0.11.0/24  AZ b</text>
  <rect class="db" x="1000" y="165" width="300" height="290" rx="8"/><text x="1012" y="186" class="s">db-a  10.0.20.0/24  AZ a</text>
  <rect class="db" x="1000" y="495" width="300" height="290" rx="8"/><text x="1012" y="516" class="s">db-b  10.0.21.0/24  AZ b</text>

  <!-- components -->
  <rect class="box" x="425" y="198" width="190" height="62" rx="8"/>
  <text x="520" y="224" text-anchor="middle" class="b">NAT Gateway (one)</text><text x="520" y="244" text-anchor="middle" class="s">added in CP4, deleted first</text>
  <rect class="box" x="425" y="340" width="190" height="80" rx="8"/>
  <text x="520" y="368" text-anchor="middle" class="b">Load balancer node</text><text x="520" y="388" text-anchor="middle" class="s">one internet-facing ALB,</text><text x="520" y="406" text-anchor="middle" class="s">a node in each public subnet</text>
  <rect class="box" x="425" y="640" width="190" height="80" rx="8"/>
  <text x="520" y="668" text-anchor="middle" class="b">Load balancer node</text><text x="520" y="688" text-anchor="middle" class="s">same ALB, second AZ</text>

  <rect class="box" x="725" y="298" width="190" height="94" rx="8"/>
  <text x="820" y="324" text-anchor="middle" class="b">EC2 app instance</text><text x="820" y="344" text-anchor="middle" class="s">FastAPI + Jinja2, port 8080</text><text x="820" y="362" text-anchor="middle" class="s">no public IP, no SSH</text>
  <rect class="box" x="725" y="640" width="190" height="94" rx="8"/>
  <text x="820" y="666" text-anchor="middle" class="b">EC2 app instance</text><text x="820" y="686" text-anchor="middle" class="s">FastAPI + Jinja2, port 8080</text><text x="820" y="704" text-anchor="middle" class="s">no public IP, no SSH</text>
  <text x="712" y="752" class="s">Auto Scaling group (D-010):</text><text x="712" y="770" class="s">1 instance while debugging, then 2</text>

  <rect class="box" x="1040" y="298" width="220" height="94" rx="8"/>
  <text x="1150" y="324" text-anchor="middle" class="b">RDS for MySQL 8.4</text><text x="1150" y="344" text-anchor="middle" class="s">single instance, encrypted</text><text x="1150" y="362" text-anchor="middle" class="s">Publicly accessible: No</text>
  <text x="1150" y="650" text-anchor="middle" class="s">No instance here: the DB subnet group</text>
  <text x="1150" y="668" text-anchor="middle" class="s">needs subnets in two AZs (D-007)</text>

  <!-- request path -->
  <path class="ln" d="M372,435 L400,435 L400,380 L425,380" marker-end="url(#a)"/>
  <path class="ln" d="M400,435 L400,680 L425,680" marker-end="url(#a)"/>
  <path class="ln" d="M615,380 L670,380 L670,345 L725,345" marker-end="url(#a)"/>
  <path class="ln" d="M615,680 L725,687" marker-end="url(#a)"/>
  <text x="672" y="338" text-anchor="middle" class="s">8080</text>
  <path class="ln" d="M915,345 L1040,345" marker-end="url(#a)"/>
  <path class="ln" d="M915,687 L975,687 L975,375 L1040,375" marker-end="url(#a)"/>
  <text x="978" y="335" text-anchor="middle" class="s">3306</text>

  <!-- outbound / admin path -->
  <path class="dl" d="M820,298 L820,229 L615,229" marker-end="url(#ad)"/>
  <text x="830" y="262" class="s">443 out via NAT</text><text x="830" y="279" class="s">(app tier)</text>
  <path class="dl" d="M425,229 L317,229 L317,400" marker-end="url(#ad)"/>
  <text x="328" y="262" class="s">to internet</text>
  <!-- AWS service endpoints are reached over the internet path (NAT -> IGW) -->
  <path class="dl" d="M290,400 L290,345 L222,345 L222,185"/>
  <path class="dl" d="M222,185 L207,185" marker-end="url(#ad)"/><path class="dl" d="M222,285 L207,285" marker-end="url(#ad)"/>
  <text x="150" y="338" text-anchor="middle" class="s">HTTPS to AWS APIs</text>
  <rect class="box" x="35" y="150" width="170" height="70" rx="8"/>
  <text x="120" y="176" text-anchor="middle" class="b">Secrets Manager</text><text x="120" y="194" text-anchor="middle" class="s">DB creds + session key</text><text x="120" y="210" text-anchor="middle" class="s">(read by instance role)</text>
  <rect class="box" x="35" y="250" width="170" height="70" rx="8"/>
  <text x="120" y="276" text-anchor="middle" class="b">Systems Manager</text><text x="120" y="294" text-anchor="middle" class="s">Session Manager shell</text><text x="120" y="310" text-anchor="middle" class="s">(admin, no port 22)</text>

  <!-- legend -->
  <path class="ln" d="M60,846 L120,846" marker-end="url(#a)"/><text x="130" y="851" class="s">Request path</text>
  <path class="dl" d="M260,846 L320,846" marker-end="url(#ad)"/><text x="330" y="851" class="s">Outbound HTTPS / admin path</text>
  <text x="60" y="880" class="s">Not drawn: route tables, IAM instance role (SSM core + read two named secrets), cross-zone load balancing, CloudWatch. Port numbers are destination ports. Plan: docs/architecture.md.</text>
</svg>
